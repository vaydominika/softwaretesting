name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: QUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  java:
    name: JUnit 5 and Mockito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean test
